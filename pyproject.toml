[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lvclr"
version = "1.0.0"
license = {file = "LICENSE"}
description = "Published LRHR microstructure regression models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "torch>=2.3,<2.4", "pytorch-lightning>=2.3,<2.4", "pandas>=2,<3", "h5py>=3.8", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
